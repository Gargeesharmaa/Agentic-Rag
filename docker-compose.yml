services:
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic_rag_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://GARGEESHARMA:GEsharma@host.docker.internal:5432/GARGEEDB
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
